<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launch</title>
</head>
<body>
    <!-- 方案A：直接拉起 Simple App Launcher (最稳妥) -->
    <a href="intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.simplemobiletools.applauncher;end" style="font-size: 24px; display: block; margin: 50px auto; text-align: center;">直接启动 Simple Launcher</a>

    <!-- 方案B：用 Intent 包装过的 Anywhere 协议 -->
    <a href="intent://open?sid=2161#Intent;scheme=anywhere;end" style="font-size: 24px; display: block; margin: 50px auto; text-align: center;">启动 Anywhere</a>
    
    <!-- 如果服务跑在电脑上，请把 127.0.0.1 换成电脑的局域网 IP -->
    <a href="http://127.0.0.1:8080" style="font-size: 24px; display: block; margin: 50px auto; text-align: center; color: #007bff; text-decoration: none; border: 1px solid #007bff; padding: 10px; border-radius: 8px; width: 80%;">进入本地 8080 切换页</a>
</body>
</html>
